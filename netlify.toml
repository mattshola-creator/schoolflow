[build]
  command = "pnpm build"
  publish = ".next"
[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"
[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
  framework = "#auto"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
